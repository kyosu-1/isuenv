problems:
  - name: isucon9-qualify
    ami_pattern: "isucon9-qualify-*"
    owner_id: "839726181030"
    ssh_user: ubuntu
    # 上流(isucon/isucon9-qualify)のREADMEがベンチ用AMIの推奨タイプを c7a.xlarge としている。
    # 同じ表の競技側推奨は c7a.large だが、こちらは matsuu AMI の既定(c5.large)のままにしている。
    bench_instance_type: c7a.xlarge
    notes: "bench手順: https://github.com/matsuu/aws-isucon/tree/main/isucon9-qualify"
  - name: isucon9-final
    ami_pattern: "isucon9-final-*"
    owner_id: "839726181030"
    ssh_user: ubuntu
    # ベンチのスペックは上流のREADME・マニュアル・公式ブログのどこにも公開されていないため、
    # bench_instance_type は設定しない(--bench-instance-type での明示指定が要る)。
    notes: "bench手順: https://github.com/matsuu/aws-isucon/tree/main/isucon9-final"
  - name: isucon10-qualify
    ami_pattern: "isucon10-qualify-*"
    owner_id: "839726181030"
    ssh_user: ubuntu
    # 本番のベンチは「1コア / 16GiB」(上流README)。AWSに同じ形は無いので、
    # メモリ16GiBを満たす最小の r5.large(2vCPU / 16GiB) にする。
    bench_instance_type: r5.large
    notes: "bench手順: https://github.com/matsuu/aws-isucon/tree/main/isucon10-qualify"
  - name: isucon10-final
    ami_pattern: "isucon10-final-*"
    owner_id: "839726181030"
    ssh_user: ubuntu
    # 本番の競技ノードは isu1「2コア / 1GiB」、isu2「2コア / 2GiB」、isu3「4コア / 1GiB」
    # (上流READMEの Expected machine specs)。3号機だけ 4vCPU の c5.xlarge にする。
    # メモリの差はインスタンスタイプでは再現できない。AMIの contestant.slice が全ノードで
    # envoy・MySQL・アプリの合計を MemoryMax=1200M に制限しているため
    # (2号機を 2GiB にするにはインスタンス内でこの値を書き換える)。
    node_instance_types: [c5.large, c5.large, c5.xlarge]
    # 本番のベンチは「8コア / 16GiB」(上流README)。c5.2xlarge がちょうど同じ。
    bench_instance_type: c5.2xlarge
    notes: "本番は3台構成(3号機のみ4コア)。bench手順: https://github.com/matsuu/aws-isucon/tree/main/isucon10-final"
  - name: isucon11-qualify
    ami_pattern: "isucon11-qualify-*"
    owner_id: "839726181030"
    ssh_user: ubuntu
    # 上流READMEに「ベンチ VM: c4.xlarge」と明記されている。
    bench_instance_type: c4.xlarge
    notes: "bench手順: https://github.com/matsuu/aws-isucon/tree/main/isucon11-qualify"
  - name: isucon11-final
    ami_pattern: "isucon11-final-*"
    owner_id: "839726181030"
    ssh_user: ubuntu
    # 上流READMEに「ベンチマーカー: c5.xlarge」と明記されている。
    bench_instance_type: c5.xlarge
    notes: "bench手順: https://github.com/matsuu/aws-isucon/tree/main/isucon11-final"
  - name: isucon12-qualify
    ami_pattern: "isucon12-qualify-*"
    owner_id: "839726181030"
    ssh_user: ubuntu
    # 本番のベンチは ECS Fargate (4vCPU / 8GB)(上流README)。c5.xlarge がちょうど同じ。
    bench_instance_type: c5.xlarge
    notes: "bench手順: https://github.com/matsuu/aws-isucon/tree/main/isucon12-qualify"
  - name: isucon12-final
    ami_pattern: "isucon12-final-*"
    owner_id: "839726181030"
    ssh_user: ubuntu
    # 本番のベンチは「4 vCPU / 8GB RAM」(上流README)。c5.xlarge がちょうど同じ。
    bench_instance_type: c5.xlarge
    notes: "bench手順: https://github.com/matsuu/aws-isucon/tree/main/isucon12-final"
  - name: isucon13
    ami_pattern: "isucon13-*"
    owner_id: "839726181030"
    ssh_user: ubuntu
    # 本番のベンチは ECS Fargate (8vCPU / 8GB)(上流README)。8vCPUを満たす最小の
    # c5.2xlarge(8vCPU / 16GiB) にする。
    bench_instance_type: c5.2xlarge
    notes: "本番は3台構成。bench手順: https://github.com/matsuu/aws-isucon/tree/main/isucon13"
  - name: isucon14
    ami_pattern: "isucon14-*"
    owner_id: "839726181030"
    ssh_user: ubuntu
    # 本番のベンチは ECS Fargate (8vCPU / 8GB)(上流README)。8vCPUを満たす最小の
    # c5.2xlarge(8vCPU / 16GiB) にする。
    bench_instance_type: c5.2xlarge
    # 手で打つ経路にはsupervisorがいないので、ISUXBENCH_TARGET ではなく
    # --addr と --target を引数で渡す。ベンチ側は :443 を自分で付けないため
    # ポートまで含めて渡すこと。
    # 上流READMEの `./bench run . run` の `. run` は `go run . run` を
    # `./bench run` に置換した残骸で、cobraが余分な位置引数を捨てているだけ。
    # ホスト名 isuride.xiv.isucon.net はAMIの自己署名証明書のSAN(*.xiv.isucon.net)に含まれる。
    bench:
      user: isucon
      workdir: /home/isucon
      command: ./bench
      args:
        - run
        - --addr
        - "{{.TargetIP}}:443"
        - --target
        - https://isuride.xiv.isucon.net
        - --payment-url
        - "http://{{.BenchIP}}:12346"
        - --payment-bind-port
        - "12346"
    notes: "本番は3台構成。bench手順: https://github.com/matsuu/aws-isucon/tree/main/isucon14"
  # private-isu は matsuu/aws-isucon ではなく catatsuy/private-isu が公開しているAMI。
  - name: private-isu
    ami_pattern: "catatsuy_private_isu_amd64_*"
    owner_id: "459514135530"
    ssh_user: ubuntu
    instance_type: c7a.large
    # 上流のREADMEが「競技 c7a.large / ベンチ c7a.xlarge」を推奨している。
    # ベンチ側が先にCPU飽和するとスコアが負荷生成側の性能で頭打ちになるため、ベンチは1段上にする。
    bench_instance_type: c7a.xlarge
    bench:
      user: isucon
      workdir: /home/isucon
      command: /home/isucon/private_isu/benchmarker/bin/benchmarker
      args:
        - -u
        - /home/isucon/private_isu/benchmarker/userdata
        - -t
        - "http://{{.TargetIP}}"
    notes: "ベンチ同梱で1台完結。--bench で専用ベンチノードを追加。bench手順: https://github.com/catatsuy/private-isu#ami"
